<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="highlight-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="llm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glowing Lines -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Box Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
    <marker id="arrowhead-highlight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64ffda" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" fill="url(#bg-grad)" rx="16" />

  <!-- Grid Pattern overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  </pattern>
  <rect width="900" height="450" fill="url(#grid)" rx="16" />

  <!-- Title -->
  <text x="450" y="45" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="1.5">QUERY LIFECYCLE: END-TO-END RAG FLOW</text>
  <line x1="320" y1="60" x2="580" y2="60" stroke="#64ffda" stroke-width="2" />

  <!-- 1. Query Input -->
  <g transform="translate(40, 150)" filter="url(#shadow)">
    <rect width="140" height="80" rx="12" fill="url(#node-grad)" stroke="#3b82f6" stroke-width="2" />
    <circle cx="70" cy="30" r="14" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="2" />
    <text x="70" y="35" font-family="sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle" font-weight="bold">Q</text>
    <text x="70" y="65" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">User Query</text>
  </g>

  <!-- Connection: Query to Hybrid Retrieval -->
  <path d="M 180 190 L 250 190" fill="none" stroke="#64ffda" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowhead-highlight)" filter="url(#glow)" />
  <text x="215" y="180" font-family="'Inter', sans-serif" font-size="12" fill="#64ffda" text-anchor="middle">Embed</text>

  <!-- 2. Hybrid Retrieval -->
  <g transform="translate(250, 100)" filter="url(#shadow)">
    <rect width="180" height="180" rx="12" fill="url(#node-grad)" stroke="#8b5cf6" stroke-width="2" />
    <text x="340" y="130" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">Hybrid Retrieval</text>
    
    <rect x="270" y="150" width="140" height="40" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1" />
    <text x="340" y="175" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Dense (Qdrant)</text>

    <text x="340" y="210" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle">+</text>

    <rect x="270" y="220" width="140" height="40" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1" />
    <text x="340" y="245" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Sparse (BM25)</text>
  </g>

  <!-- Connection: Retrieval to Reranker (Multiple chunks) -->
  <path d="M 430 160 L 510 170" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M 430 190 L 510 190" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M 430 220 L 510 210" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="470" y="150" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Top 15 Chunks</text>

  <!-- 3. Reranker -->
  <g transform="translate(510, 110)" filter="url(#shadow)">
    <rect width="160" height="160" rx="12" fill="url(#node-grad)" stroke="#ec4899" stroke-width="2" />
    <text x="590" y="145" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">Reranker</text>
    <text x="590" y="165" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Cross-Encoder</text>
    
    <path d="M 550 190 L 630 190 M 560 210 L 620 210 M 570 230 L 610 230" fill="none" stroke="#ec4899" stroke-width="3" />
    <polygon points="590,250 580,240 600,240" fill="#ec4899" />
  </g>

  <!-- Connection: Reranker to LLM -->
  <path d="M 670 190 L 730 190" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)" filter="url(#glow)"/>
  <text x="700" y="180" font-family="'Inter', sans-serif" font-size="12" fill="#10b981" text-anchor="middle">Top 5 Context</text>

  <!-- 4. LLM Generation -->
  <g transform="translate(730, 130)" filter="url(#shadow)">
    <rect width="140" height="120" rx="12" fill="url(#llm-grad)" stroke="#fbbf24" stroke-width="2" />
    <text x="800" y="170" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">Groq</text>
    <text x="800" y="195" font-family="'Inter', sans-serif" font-size="12" fill="#fef3c7" text-anchor="middle">LLM Generation</text>
    
    <rect x="750" y="210" width="100" height="20" rx="4" fill="#000" fill-opacity="0.3" />
    <text x="800" y="224" font-family="'Inter', sans-serif" font-size="10" fill="#fff" text-anchor="middle">Prompt + Context</text>
  </g>

  <!-- Return Path to User -->
  <path d="M 800 250 L 800 340 L 110 340 L 110 230" fill="none" stroke="#64ffda" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowhead-highlight)" filter="url(#glow)" />
  <text x="450" y="330" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#64ffda" text-anchor="middle">Final Answer (Synthesized &amp; Grounded)</text>

</svg>