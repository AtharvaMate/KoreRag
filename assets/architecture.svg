<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e1e" />
      <stop offset="100%" stop-color="#2a2a2a" />
    </linearGradient>

    <!-- Glowing Lines -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Box Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8892b0" />
    </marker>
    <marker id="arrowhead-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64ffda" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bg-grad)" rx="16" />

  <!-- Grid Pattern overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  </pattern>
  <rect width="1000" height="600" fill="url(#grid)" rx="16" />

  <!-- Title -->
  <text x="500" y="50" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="1.5">MULTI-TENANT RAG ARCHITECTURE</text>
  <line x1="380" y1="65" x2="620" y2="65" stroke="#64ffda" stroke-width="2" />

  <!-- Groups/Boxes -->
  
  <!-- 1. Client -->
  <g transform="translate(50, 250)" filter="url(#shadow)">
    <rect width="160" height="100" rx="12" fill="url(#node-grad)" stroke="#334155" stroke-width="2" />
    <circle cx="80" cy="35" r="16" fill="#2563eb" fill-opacity="0.2" stroke="#3b82f6" stroke-width="2" />
    <text x="80" y="41" font-family="sans-serif" font-size="14" fill="#60a5fa" text-anchor="middle" font-weight="bold">WEB</text>
    <text x="80" y="70" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#f8fafc" text-anchor="middle">Client App</text>
    <text x="80" y="88" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">React / Vue / HTML</text>
  </g>

  <!-- 2. API Layer -->
  <g transform="translate(300, 150)" filter="url(#shadow)">
    <rect width="200" height="300" rx="12" fill="url(#node-grad)" stroke="#10b981" stroke-width="2" />
    <text x="400" y="180" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">FastAPI Server</text>
    <rect x="320" y="210" width="160" height="40" rx="6" fill="#1e293b" />
    <text x="400" y="235" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">Auth &amp; Tenants (JWT)</text>
    
    <rect x="320" y="260" width="160" height="40" rx="6" fill="#1e293b" />
    <text x="400" y="285" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">Document Chunker</text>

    <rect x="320" y="310" width="160" height="40" rx="6" fill="#1e293b" />
    <text x="400" y="335" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">Hybrid Retriever</text>

    <rect x="320" y="360" width="160" height="40" rx="6" fill="#1e293b" />
    <text x="400" y="385" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">Cross-Encoder Reranker</text>
  </g>

  <!-- 3. Vector DB -->
  <g transform="translate(650, 100)" filter="url(#shadow)">
    <rect width="250" height="120" rx="12" fill="url(#node-grad)" stroke="#ec4899" stroke-width="2" />
    <!-- Cylinder Icon -->
    <path d="M 680 130 C 680 125, 710 125, 710 130 C 710 135, 680 135, 680 130 Z" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="2" />
    <path d="M 680 130 L 680 150 C 680 155, 710 155, 710 150 L 710 130" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="2" />
    
    <text x="775" y="145" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">Qdrant DB</text>
    <text x="775" y="170" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Vector Embeddings</text>
    <text x="775" y="190" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">(BM25 + Dense)</text>
  </g>

  <!-- 4. Relational DB -->
  <g transform="translate(650, 260)" filter="url(#shadow)">
    <rect width="250" height="120" rx="12" fill="url(#node-grad)" stroke="#3b82f6" stroke-width="2" />
    <!-- Cylinder Icon -->
    <path d="M 680 290 C 680 285, 710 285, 710 290 C 710 295, 680 295, 680 290 Z" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="2" />
    <path d="M 680 290 L 680 310 C 680 315, 710 315, 710 310 L 710 290" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="2" />
    
    <text x="775" y="305" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">PostgreSQL</text>
    <text x="775" y="330" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Tenants &amp; Users</text>
    <text x="775" y="350" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Document Metadata</text>
  </g>

  <!-- 5. LLM Provider -->
  <g transform="translate(650, 420)" filter="url(#shadow)">
    <rect width="250" height="120" rx="12" fill="url(#node-grad)" stroke="#f59e0b" stroke-width="2" />
    <!-- AI Brain or Sparks -->
    <circle cx="695" cy="460" r="14" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2" />
    
    <text x="775" y="465" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">Groq (LLM)</text>
    <text x="775" y="490" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">OpenAI GPT-OSS / Llama3</text>
    <text x="775" y="510" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Generation &amp; QA</text>
  </g>

  <!-- Connection Lines -->
  
  <!-- Client to API -->
  <path d="M 210 300 L 300 300" fill="none" stroke="#64ffda" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowhead-accent)" filter="url(#glow)" />
  <text x="255" y="290" font-family="'Inter', sans-serif" font-size="12" fill="#64ffda" text-anchor="middle">HTTP/JSON</text>

  <!-- API to Qdrant -->
  <path d="M 500 210 L 575 210 L 575 160 L 650 160" fill="none" stroke="#8892b0" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="575" y="150" font-family="'Inter', sans-serif" font-size="12" fill="#8892b0" text-anchor="middle">Search / Index</text>

  <!-- API to Postgres -->
  <path d="M 500 300 L 650 300" fill="none" stroke="#8892b0" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="575" y="290" font-family="'Inter', sans-serif" font-size="12" fill="#8892b0" text-anchor="middle">SQLAlchemy</text>

  <!-- API to Groq -->
  <path d="M 500 390 L 575 390 L 575 480 L 650 480" fill="none" stroke="#8892b0" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="575" y="470" font-family="'Inter', sans-serif" font-size="12" fill="#8892b0" text-anchor="middle">LangChain</text>

  <!-- Decorative elements -->
  <circle cx="10" cy="10" r="2" fill="#334155" />
  <circle cx="990" cy="10" r="2" fill="#334155" />
  <circle cx="10" cy="590" r="2" fill="#334155" />
  <circle cx="990" cy="590" r="2" fill="#334155" />

</svg>
