<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Client sends requests to a FastAPI gateway with JWT and tenant auth, which splits into a document ingestion pipeline and a query/hybrid retrieval pipeline, both backed by a Postgres and Qdrant storage layer, flowing through reranking and LLM generation to a final answer.</desc>
