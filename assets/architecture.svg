<svg width="100%" viewBox="0 0 960 900" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;">
  <title>Nexus RAG — Full System Architecture</title>
  <desc>End-to-end architecture: Client, FastAPI, LangGraph Agent routing to HyDE+Hybrid RAG or Tavily online search, with Redis cache, Qdrant, PostgreSQL, and cross-encoder reranking.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1.5L8 5L2 8.5" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1.5L8 5L2 8.5" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1.5L8 5L2 8.5" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1.5L8 5L2 8.5" fill="none" stroke="#f87171" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="s" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="900" rx="14" fill="url(#bg)"/>

  <!-- ──── TITLE ──── -->
  <text x="480" y="38" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700" letter-spacing="1.5">NEXUS RAG — SYSTEM ARCHITECTURE</text>
  <line x1="310" y1="50" x2="650" y2="50" stroke="#334155" stroke-width="1"/>

  <!-- ════════════════ ROW 1: CLIENT ════════════════ -->
  <rect x="355" y="66" width="250" height="50" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#s)"/>
  <text x="480" y="86" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="600">Client</text>
  <text x="480" y="103" text-anchor="middle" fill="#94a3b8" font-size="10">Web UI · Admin Panel · REST API</text>
  <!-- ↓ -->
  <line x1="480" y1="116" x2="480" y2="138" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ════════════════ ROW 2: FASTAPI GATEWAY ════════════════ -->
  <rect x="280" y="142" width="400" height="54" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="1" filter="url(#s)"/>
  <text x="480" y="163" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="600">FastAPI Gateway</text>
  <text x="480" y="182" text-anchor="middle" fill="#60a5fa" font-size="10">JWT Auth · Tenant Context Injection · CORS · Async</text>
  <!-- ↓ -->
  <line x1="480" y1="196" x2="480" y2="220" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ════════════════ ROW 3: REDIS CACHE ════════════════ -->
  <rect x="330" y="224" width="300" height="50" rx="10" fill="#1c1917" stroke="#dc2626" stroke-width="1" filter="url(#s)"/>
  <text x="480" y="244" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="600">Redis Cache</text>
  <text x="480" y="261" text-anchor="middle" fill="#ef4444" font-size="10">SHA-256 Content-Addressed · TTL · Tenant Invalidation</text>

  <!-- Cache HIT shortcut → Response -->
  <text x="645" y="240" text-anchor="start" fill="#4ade80" font-size="9" font-weight="600">⚡ CACHE HIT</text>
  <path d="M630 249 Q660 249 660 270 L660 838 Q660 848 650 848 L618 848" fill="none" stroke="#4ade80" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#ag)"/>

  <!-- Cache MISS ↓ -->
  <line x1="480" y1="274" x2="480" y2="302" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="492" y="292" fill="#64748b" font-size="9">MISS</text>

  <!-- ════════════════ ROW 4: LANGGRAPH AGENT ════════════════ -->
  <rect x="305" y="306" width="350" height="54" rx="10" fill="#312e81" stroke="#818cf8" stroke-width="1" filter="url(#s)"/>
  <text x="480" y="327" text-anchor="middle" fill="#c7d2fe" font-size="14" font-weight="600">LangGraph Agent</text>
  <text x="480" y="346" text-anchor="middle" fill="#a5b4fc" font-size="10">StateGraph · Conditional Routing · Mode Selection</text>

  <!-- Branching: left = rag, right = online -->
  <path d="M410 360 L410 382 L230 382 L230 404" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M550 360 L550 382 L730 382 L730 404" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ay)"/>
  <text x="300" y="396" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">mode = "rag"</text>
  <text x="660" y="396" text-anchor="middle" fill="#fde68a" font-size="10" font-weight="600">mode = "online"</text>

  <!-- ════════════════ ROW 5 LEFT: HyDE RETRIEVER ════════════════ -->
  <rect x="80" y="408" width="300" height="54" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1" filter="url(#s)"/>
  <text x="230" y="429" text-anchor="middle" fill="#a7f3d0" font-size="13" font-weight="600">HyDE Retriever</text>
  <text x="230" y="448" text-anchor="middle" fill="#6ee7b7" font-size="10">LLM → Hypothetical Doc → Embed → Dense Search</text>
  <!-- ↓ -->
  <line x1="230" y1="462" x2="230" y2="490" stroke="#34d399" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- ════════════════ ROW 5 RIGHT: TAVILY WEB SEARCH ════════════════ -->
  <rect x="580" y="408" width="300" height="54" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="1" filter="url(#s)"/>
  <text x="730" y="429" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="600">Tavily Web Search</text>
  <text x="730" y="448" text-anchor="middle" fill="#fbbf24" font-size="10">Real-Time Information · 5 Results · Cited Sources</text>

  <!-- ════════════════ ROW 6: ENSEMBLE RETRIEVER ════════════════ -->
  <rect x="80" y="494" width="300" height="54" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1" filter="url(#s)"/>
  <text x="230" y="515" text-anchor="middle" fill="#a7f3d0" font-size="13" font-weight="600">Ensemble Retriever</text>
  <text x="230" y="534" text-anchor="middle" fill="#6ee7b7" font-size="10">Dense (HyDE 0.6) + Sparse (BM25 0.4) Fusion</text>
  <!-- ↓ -->
  <line x1="230" y1="548" x2="230" y2="576" stroke="#34d399" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- ════════════════ ROW 7: CROSS-ENCODER RERANKER ════════════════ -->
  <rect x="80" y="580" width="300" height="54" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1" filter="url(#s)"/>
  <text x="230" y="601" text-anchor="middle" fill="#a7f3d0" font-size="13" font-weight="600">Cross-Encoder Reranker</text>
  <text x="230" y="620" text-anchor="middle" fill="#6ee7b7" font-size="10">BAAI/bge-reranker-base · Top-5 Selection</text>

  <!-- ════════════════ CONVERGE TO LLM ════════════════ -->
  <!-- RAG path → LLM -->
  <path d="M230 634 L230 660 L480 660 L480 690" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#ag)"/>
  <!-- Online path → LLM -->
  <path d="M730 462 L730 660 L480 660" fill="none" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- ════════════════ ROW 8: LLM GENERATION ════════════════ -->
  <rect x="330" y="694" width="300" height="54" rx="10" fill="#312e81" stroke="#818cf8" stroke-width="1" filter="url(#s)"/>
  <text x="480" y="715" text-anchor="middle" fill="#c7d2fe" font-size="14" font-weight="600">LLM Generation</text>
  <text x="480" y="734" text-anchor="middle" fill="#a5b4fc" font-size="10">Groq · gpt-oss-120b · Source-Cited Answers</text>
  <!-- ↓ -->
  <line x1="480" y1="748" x2="480" y2="770" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- cache write arrow (from LLM back to Redis) -->
  <text x="316" y="730" text-anchor="end" fill="#ef4444" font-size="9" font-weight="500">cache write ↑</text>
  <path d="M330 720 L300 720 L300 249 L330 249" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#ar)"/>

  <!-- ════════════════ ROW 9: RESPONSE ════════════════ -->
  <rect x="355" y="774" width="250" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#s)"/>
  <text x="480" y="794" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Response</text>
  <text x="480" y="811" text-anchor="middle" fill="#94a3b8" font-size="10">answer · sources · cache_hit · response_time_ms</text>

  <!-- ════════════════ SIDE PANEL — DATA STORES (bottom-right) ════════════════ -->
  <rect x="700" y="520" width="230" height="125" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#s)"/>
  <text x="815" y="543" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Data Stores</text>
  <line x1="720" y1="553" x2="910" y2="553" stroke="#1e293b" stroke-width="1"/>
  <circle cx="730" cy="573" r="4" fill="#818cf8"/>
  <text x="742" y="577" fill="#a5b4fc" font-size="11">Qdrant Vector DB</text>
  <circle cx="730" cy="597" r="4" fill="#3b82f6"/>
  <text x="742" y="601" fill="#60a5fa" font-size="11">PostgreSQL (asyncpg)</text>
  <circle cx="730" cy="621" r="4" fill="#ef4444"/>
  <text x="742" y="625" fill="#f87171" font-size="11">Redis (hiredis)</text>
  <text x="815" y="640" text-anchor="middle" fill="#475569" font-size="8">Record Manager · Cache · Auth</text>
  <!-- Dashed connector from Ensemble to Data Stores -->
  <path d="M380 521 L700 555" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ════════════════ SIDE PANEL — EMBEDDINGS (far right, above data stores) ════════════════ -->
  <rect x="700" y="470" width="230" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#s)"/>
  <text x="815" y="487" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Embeddings</text>
  <text x="815" y="502" text-anchor="middle" fill="#64748b" font-size="9">BAAI/bge-large-en-v1.5 · 1024-dim · Cached</text>

  <!-- ════════════════ SIDE PANEL — INGESTION PIPELINE (bottom-left) ════════════════ -->
  <rect x="30" y="700" width="230" height="130" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#s)"/>
  <text x="145" y="722" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Ingestion Pipeline</text>
  <line x1="50" y1="732" x2="240" y2="732" stroke="#1e293b" stroke-width="1"/>
  <text x="62" y="750" fill="#94a3b8" font-size="10">1. Markdown Header Split</text>
  <text x="62" y="768" fill="#94a3b8" font-size="10">2. Semantic Chunking</text>
  <text x="62" y="786" fill="#94a3b8" font-size="10">3. Table Linearization</text>
  <text x="62" y="804" fill="#94a3b8" font-size="10">4. Incremental Indexing</text>
  <text x="145" y="822" text-anchor="middle" fill="#475569" font-size="9">SQLRecordManager → Qdrant</text>

  <!-- ════════════════ LEGEND (bottom center) ════════════════ -->
  <rect x="290" y="852" width="380" height="36" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <line x1="315" y1="870" x2="335" y2="870" stroke="#34d399" stroke-width="2"/>
  <text x="340" y="874" fill="#94a3b8" font-size="9">RAG path</text>
  <line x1="400" y1="870" x2="420" y2="870" stroke="#fbbf24" stroke-width="2"/>
  <text x="425" y="874" fill="#94a3b8" font-size="9">Online path</text>
  <line x1="500" y1="870" x2="520" y2="870" stroke="#4ade80" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="525" y="874" fill="#94a3b8" font-size="9">Cache hit</text>
  <line x1="586" y1="870" x2="606" y2="870" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="611" y="874" fill="#94a3b8" font-size="9">Cache write</text>

</svg>